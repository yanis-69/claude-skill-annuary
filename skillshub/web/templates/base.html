<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Skills Hub{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Skills Hub<span>.</span></a>
    <nav>
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Annuaire</a>
      <a href="/stats" {% if request.url.path == "/stats" %}aria-current="page"{% endif %}>Statistiques</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Les champs vides ne sont pas envoyés : l'URL partagée reste courte.
    document.addEventListener("htmx:configRequest", function (e) {
      var p = e.detail.parameters;
      Object.keys(p).forEach(function (k) { if (p[k] === "") { delete p[k]; } });
    });
  </script>
</body>
</html>
